naftiko: 1.0.0-alpha2
info:
  label: Microsoft Purview eDiscovery API — Custodians
  description: 'Microsoft Purview eDiscovery API — Custodians. 2 operations. Lead operation: Microsoft Purview List custodians
    in a case. Self-contained Naftiko capability covering one Microsoft Purview business surface.'
  tags:
  - Microsoft Purview
  - Custodians
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_PURVIEW_API_KEY: MICROSOFT_PURVIEW_API_KEY
capability:
  consumes:
  - type: http
    namespace: ediscovery-custodians
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Purview eDiscovery API — Custodians business capability. Self-contained, no shared references.
    resources:
    - name: security-cases-ediscoveryCases-ediscoveryCaseId-custodians
      path: /security/cases/ediscoveryCases/{ediscoveryCaseId}/custodians
      operations:
      - name: listcustodians
        method: GET
        description: Microsoft Purview List custodians in a case
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ediscoveryCaseId
          in: path
          type: string
          required: true
      - name: createcustodian
        method: POST
        description: Microsoft Purview Add a custodian to a case
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ediscoveryCaseId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_PURVIEW_API_KEY}}'
  exposes:
  - type: rest
    namespace: ediscovery-custodians-rest
    port: 8080
    description: REST adapter for Microsoft Purview eDiscovery API — Custodians. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/security/cases/ediscoverycases/{ediscoverycaseid}/custodians
      name: security-cases-ediscoverycases-ediscoverycaseid-custodians
      description: REST surface for security-cases-ediscoveryCases-ediscoveryCaseId-custodians.
      operations:
      - method: GET
        name: listcustodians
        description: Microsoft Purview List custodians in a case
        call: ediscovery-custodians.listcustodians
        with:
          ediscoveryCaseId: rest.ediscoveryCaseId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcustodian
        description: Microsoft Purview Add a custodian to a case
        call: ediscovery-custodians.createcustodian
        with:
          ediscoveryCaseId: rest.ediscoveryCaseId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ediscovery-custodians-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Purview eDiscovery API — Custodians. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: microsoft-purview-list-custodians-case
      description: Microsoft Purview List custodians in a case
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ediscovery-custodians.listcustodians
      with:
        ediscoveryCaseId: tools.ediscoveryCaseId
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-purview-add-custodian-case
      description: Microsoft Purview Add a custodian to a case
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ediscovery-custodians.createcustodian
      with:
        ediscoveryCaseId: tools.ediscoveryCaseId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
