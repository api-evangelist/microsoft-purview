naftiko: 1.0.0-alpha2
info:
  label: Microsoft Purview Scanning API — Classification Rules
  description: 'Microsoft Purview Scanning API — Classification Rules. 4 operations. Lead operation: Microsoft Purview List
    classification rules. Self-contained Naftiko capability covering one Microsoft Purview business surface.'
  tags:
  - Microsoft Purview
  - Classification Rules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_PURVIEW_API_KEY: MICROSOFT_PURVIEW_API_KEY
capability:
  consumes:
  - type: http
    namespace: scanning-classification-rules
    baseUri: https://{accountName}.scan.purview.azure.com
    description: Microsoft Purview Scanning API — Classification Rules business capability. Self-contained, no shared references.
    resources:
    - name: scan-classificationrules
      path: /scan/classificationrules
      operations:
      - name: listclassificationrules
        method: GET
        description: Microsoft Purview List classification rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: api-version
          in: query
          type: string
          required: true
    - name: scan-classificationrules-classificationRuleName
      path: /scan/classificationrules/{classificationRuleName}
      operations:
      - name: createorreplaceclassificationrule
        method: PUT
        description: Microsoft Purview Create or replace a classification rule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: classificationRuleName
          in: path
          type: string
          required: true
        - name: api-version
          in: query
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: getclassificationrule
        method: GET
        description: Microsoft Purview Get a classification rule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: classificationRuleName
          in: path
          type: string
          required: true
        - name: api-version
          in: query
          type: string
          required: true
      - name: deleteclassificationrule
        method: DELETE
        description: Microsoft Purview Delete a classification rule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: classificationRuleName
          in: path
          type: string
          required: true
        - name: api-version
          in: query
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_PURVIEW_API_KEY}}'
  exposes:
  - type: rest
    namespace: scanning-classification-rules-rest
    port: 8080
    description: REST adapter for Microsoft Purview Scanning API — Classification Rules. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/scan/classificationrules
      name: scan-classificationrules
      description: REST surface for scan-classificationrules.
      operations:
      - method: GET
        name: listclassificationrules
        description: Microsoft Purview List classification rules
        call: scanning-classification-rules.listclassificationrules
        with:
          api-version: rest.api-version
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/scan/classificationrules/{classificationrulename}
      name: scan-classificationrules-classificationrulename
      description: REST surface for scan-classificationrules-classificationRuleName.
      operations:
      - method: PUT
        name: createorreplaceclassificationrule
        description: Microsoft Purview Create or replace a classification rule
        call: scanning-classification-rules.createorreplaceclassificationrule
        with:
          classificationRuleName: rest.classificationRuleName
          api-version: rest.api-version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getclassificationrule
        description: Microsoft Purview Get a classification rule
        call: scanning-classification-rules.getclassificationrule
        with:
          classificationRuleName: rest.classificationRuleName
          api-version: rest.api-version
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteclassificationrule
        description: Microsoft Purview Delete a classification rule
        call: scanning-classification-rules.deleteclassificationrule
        with:
          classificationRuleName: rest.classificationRuleName
          api-version: rest.api-version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: scanning-classification-rules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Purview Scanning API — Classification Rules. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-purview-list-classification-rules
      description: Microsoft Purview List classification rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: scanning-classification-rules.listclassificationrules
      with:
        api-version: tools.api-version
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-purview-create-replace-classification
      description: Microsoft Purview Create or replace a classification rule
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: scanning-classification-rules.createorreplaceclassificationrule
      with:
        classificationRuleName: tools.classificationRuleName
        api-version: tools.api-version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-purview-get-classification-rule
      description: Microsoft Purview Get a classification rule
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: scanning-classification-rules.getclassificationrule
      with:
        classificationRuleName: tools.classificationRuleName
        api-version: tools.api-version
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-purview-delete-classification-rule
      description: Microsoft Purview Delete a classification rule
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: scanning-classification-rules.deleteclassificationrule
      with:
        classificationRuleName: tools.classificationRuleName
        api-version: tools.api-version
      outputParameters:
      - type: object
        mapping: $.
