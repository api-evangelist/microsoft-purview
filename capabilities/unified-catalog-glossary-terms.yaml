naftiko: 1.0.0-alpha2
info:
  label: Microsoft Purview Unified Catalog API — Glossary Terms
  description: 'Microsoft Purview Unified Catalog API — Glossary Terms. 1 operations. Lead operation: Microsoft Purview List
    glossary terms. Self-contained Naftiko capability covering one Microsoft Purview business surface.'
  tags:
  - Microsoft Purview
  - Glossary Terms
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_PURVIEW_API_KEY: MICROSOFT_PURVIEW_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-catalog-glossary-terms
    baseUri: https://{accountName}.purview.azure.com
    description: Microsoft Purview Unified Catalog API — Glossary Terms business capability. Self-contained, no shared references.
    resources:
    - name: glossaryterms
      path: /glossaryterms
      operations:
      - name: listunifiedglossaryterms
        method: GET
        description: Microsoft Purview List glossary terms
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: api-version
          in: query
          type: string
          required: true
        - name: maxpagesize
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_PURVIEW_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-catalog-glossary-terms-rest
    port: 8080
    description: REST adapter for Microsoft Purview Unified Catalog API — Glossary Terms. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/glossaryterms
      name: glossaryterms
      description: REST surface for glossaryterms.
      operations:
      - method: GET
        name: listunifiedglossaryterms
        description: Microsoft Purview List glossary terms
        call: unified-catalog-glossary-terms.listunifiedglossaryterms
        with:
          api-version: rest.api-version
          maxpagesize: rest.maxpagesize
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-catalog-glossary-terms-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Purview Unified Catalog API — Glossary Terms. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-purview-list-glossary-terms
      description: Microsoft Purview List glossary terms
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-catalog-glossary-terms.listunifiedglossaryterms
      with:
        api-version: tools.api-version
        maxpagesize: tools.maxpagesize
      outputParameters:
      - type: object
        mapping: $.
