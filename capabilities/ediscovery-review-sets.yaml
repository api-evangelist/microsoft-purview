naftiko: 1.0.0-alpha2
info:
  label: Microsoft Purview eDiscovery API — Review Sets
  description: 'Microsoft Purview eDiscovery API — Review Sets. 2 operations. Lead operation: Microsoft Purview List review
    sets in a case. Self-contained Naftiko capability covering one Microsoft Purview business surface.'
  tags:
  - Microsoft Purview
  - Review Sets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_PURVIEW_API_KEY: MICROSOFT_PURVIEW_API_KEY
capability:
  consumes:
  - type: http
    namespace: ediscovery-review-sets
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Purview eDiscovery API — Review Sets business capability. Self-contained, no shared references.
    resources:
    - name: security-cases-ediscoveryCases-ediscoveryCaseId-reviewSets
      path: /security/cases/ediscoveryCases/{ediscoveryCaseId}/reviewSets
      operations:
      - name: listreviewsets
        method: GET
        description: Microsoft Purview List review sets in a case
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ediscoveryCaseId
          in: path
          type: string
          required: true
      - name: createreviewset
        method: POST
        description: Microsoft Purview Create a review set
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ediscoveryCaseId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_PURVIEW_API_KEY}}'
  exposes:
  - type: rest
    namespace: ediscovery-review-sets-rest
    port: 8080
    description: REST adapter for Microsoft Purview eDiscovery API — Review Sets. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/security/cases/ediscoverycases/{ediscoverycaseid}/reviewsets
      name: security-cases-ediscoverycases-ediscoverycaseid-reviewsets
      description: REST surface for security-cases-ediscoveryCases-ediscoveryCaseId-reviewSets.
      operations:
      - method: GET
        name: listreviewsets
        description: Microsoft Purview List review sets in a case
        call: ediscovery-review-sets.listreviewsets
        with:
          ediscoveryCaseId: rest.ediscoveryCaseId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createreviewset
        description: Microsoft Purview Create a review set
        call: ediscovery-review-sets.createreviewset
        with:
          ediscoveryCaseId: rest.ediscoveryCaseId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ediscovery-review-sets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Purview eDiscovery API — Review Sets. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: microsoft-purview-list-review-sets
      description: Microsoft Purview List review sets in a case
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ediscovery-review-sets.listreviewsets
      with:
        ediscoveryCaseId: tools.ediscoveryCaseId
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-purview-create-review-set
      description: Microsoft Purview Create a review set
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ediscovery-review-sets.createreviewset
      with:
        ediscoveryCaseId: tools.ediscoveryCaseId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
