naftiko: 1.0.0-alpha2
info:
  label: Microsoft Purview eDiscovery API — Legal Holds
  description: 'Microsoft Purview eDiscovery API — Legal Holds. 2 operations. Lead operation: Microsoft Purview List legal
    holds. Self-contained Naftiko capability covering one Microsoft Purview business surface.'
  tags:
  - Microsoft Purview
  - Legal Holds
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_PURVIEW_API_KEY: MICROSOFT_PURVIEW_API_KEY
capability:
  consumes:
  - type: http
    namespace: ediscovery-legal-holds
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Purview eDiscovery API — Legal Holds business capability. Self-contained, no shared references.
    resources:
    - name: security-cases-ediscoveryCases-ediscoveryCaseId-legalHolds
      path: /security/cases/ediscoveryCases/{ediscoveryCaseId}/legalHolds
      operations:
      - name: listlegalholds
        method: GET
        description: Microsoft Purview List legal holds
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ediscoveryCaseId
          in: path
          type: string
          required: true
      - name: createlegalhold
        method: POST
        description: Microsoft Purview Create a legal hold
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ediscoveryCaseId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_PURVIEW_API_KEY}}'
  exposes:
  - type: rest
    namespace: ediscovery-legal-holds-rest
    port: 8080
    description: REST adapter for Microsoft Purview eDiscovery API — Legal Holds. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/security/cases/ediscoverycases/{ediscoverycaseid}/legalholds
      name: security-cases-ediscoverycases-ediscoverycaseid-legalholds
      description: REST surface for security-cases-ediscoveryCases-ediscoveryCaseId-legalHolds.
      operations:
      - method: GET
        name: listlegalholds
        description: Microsoft Purview List legal holds
        call: ediscovery-legal-holds.listlegalholds
        with:
          ediscoveryCaseId: rest.ediscoveryCaseId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createlegalhold
        description: Microsoft Purview Create a legal hold
        call: ediscovery-legal-holds.createlegalhold
        with:
          ediscoveryCaseId: rest.ediscoveryCaseId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ediscovery-legal-holds-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Purview eDiscovery API — Legal Holds. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: microsoft-purview-list-legal-holds
      description: Microsoft Purview List legal holds
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ediscovery-legal-holds.listlegalholds
      with:
        ediscoveryCaseId: tools.ediscoveryCaseId
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-purview-create-legal-hold
      description: Microsoft Purview Create a legal hold
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ediscovery-legal-holds.createlegalhold
      with:
        ediscoveryCaseId: tools.ediscoveryCaseId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
