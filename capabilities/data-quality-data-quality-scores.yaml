naftiko: 1.0.0-alpha2
info:
  label: Microsoft Purview Data Quality API — Data Quality Scores
  description: 'Microsoft Purview Data Quality API — Data Quality Scores. 2 operations. Lead operation: Microsoft Purview
    List data quality scores. Self-contained Naftiko capability covering one Microsoft Purview business surface.'
  tags:
  - Microsoft Purview
  - Data Quality Scores
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_PURVIEW_API_KEY: MICROSOFT_PURVIEW_API_KEY
capability:
  consumes:
  - type: http
    namespace: data-quality-data-quality-scores
    baseUri: https://{accountName}.purview.azure.com
    description: Microsoft Purview Data Quality API — Data Quality Scores business capability. Self-contained, no shared references.
    resources:
    - name: dataquality-scores
      path: /dataquality/scores
      operations:
      - name: listdataqualityscores
        method: GET
        description: Microsoft Purview List data quality scores
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: api-version
          in: query
          type: string
          required: true
        - name: assetId
          in: query
          type: string
          description: Filter scores by data asset identifier
        - name: maxpagesize
          in: query
          type: integer
    - name: dataquality-scores-scoreId
      path: /dataquality/scores/{scoreId}
      operations:
      - name: getdataqualityscore
        method: GET
        description: Microsoft Purview Get a data quality score
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: scoreId
          in: path
          type: string
          required: true
        - name: api-version
          in: query
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_PURVIEW_API_KEY}}'
  exposes:
  - type: rest
    namespace: data-quality-data-quality-scores-rest
    port: 8080
    description: REST adapter for Microsoft Purview Data Quality API — Data Quality Scores. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/dataquality/scores
      name: dataquality-scores
      description: REST surface for dataquality-scores.
      operations:
      - method: GET
        name: listdataqualityscores
        description: Microsoft Purview List data quality scores
        call: data-quality-data-quality-scores.listdataqualityscores
        with:
          api-version: rest.api-version
          assetId: rest.assetId
          maxpagesize: rest.maxpagesize
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/dataquality/scores/{scoreid}
      name: dataquality-scores-scoreid
      description: REST surface for dataquality-scores-scoreId.
      operations:
      - method: GET
        name: getdataqualityscore
        description: Microsoft Purview Get a data quality score
        call: data-quality-data-quality-scores.getdataqualityscore
        with:
          scoreId: rest.scoreId
          api-version: rest.api-version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: data-quality-data-quality-scores-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Purview Data Quality API — Data Quality Scores. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-purview-list-data-quality
      description: Microsoft Purview List data quality scores
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: data-quality-data-quality-scores.listdataqualityscores
      with:
        api-version: tools.api-version
        assetId: tools.assetId
        maxpagesize: tools.maxpagesize
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-purview-get-data-quality
      description: Microsoft Purview Get a data quality score
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: data-quality-data-quality-scores.getdataqualityscore
      with:
        scoreId: tools.scoreId
        api-version: tools.api-version
      outputParameters:
      - type: object
        mapping: $.
