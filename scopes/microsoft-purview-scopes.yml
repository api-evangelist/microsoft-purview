notes: >-
  Azure data/management-plane access uses resource-level .default scopes
  (https://purview.azure.net/.default for the Purview data plane,
  https://management.azure.com/.default for the ARM Account API) issued by the
  Microsoft identity platform; fine-grained authorization is then enforced by
  Purview collection roles (Metadata Policies) and Azure RBAC rather than by
  granular OAuth scopes. The Graph-based APIs use granular Microsoft Graph
  application/delegated permissions (eDiscovery.*, RecordsManagement.*,
  InformationProtectionPolicy.*), documented in the Graph permissions reference.
