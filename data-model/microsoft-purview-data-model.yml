  - {from: Workflow, to: WorkflowRun, kind: has_many, via: workflowId}
  - {from: WorkflowRun, to: WorkflowTask, kind: has_many, via: runId}
  - {from: ediscoveryCase, to: ediscoveryCustodian, kind: has_many, via: caseId}
  - {from: ediscoveryCase, to: ediscoverySearch, kind: has_many, via: caseId}
  - {from: ediscoveryCase, to: ediscoveryReviewSet, kind: has_many, via: caseId}
