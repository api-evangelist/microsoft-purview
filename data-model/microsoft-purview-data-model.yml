  - {from: AtlasEntity, to: AtlasLineageInfo, kind: has_one, via: guid}
  - {from: AtlasGlossary, to: AtlasGlossaryCategory, kind: has_many, via: categories}
  - {from: AtlasGlossary, to: AtlasGlossaryTerm, kind: has_many, via: terms}
  - {from: AtlasGlossaryTerm, to: AtlasGlossaryCategory, kind: has_many, via: categories}
  - {from: AtlasGlossaryTerm, to: AtlasEntity, kind: has_many, via: assignedEntities}
  - {from: Scan, to: DataSource, kind: belongs_to, via: dataSourceName}
  - {from: Scan, to: ScanRuleset, kind: belongs_to, via: scanRulesetName}
  - {from: Scan, to: Trigger, kind: has_one, via: scanName}
