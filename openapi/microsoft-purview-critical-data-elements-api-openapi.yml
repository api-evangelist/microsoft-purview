openapi: 3.2.0
info:
  title: Microsoft Purview Unified Catalog Critical Data Elements API
  description: APIs for programmatically integrating and managing the Microsoft Purview Unified Catalog. Supports operations on business domains, glossary terms, data products, OKRs, critical data elements, and data access policies.
  version: 2024-03-01-preview
  contact:
    name: Microsoft Purview Support
    url: https://learn.microsoft.com/en-us/purview/
  license:
    name: Microsoft API License
    url: https://azure.microsoft.com/en-us/support/legal/
servers:
- url: https://{accountName}.purview.azure.com
  description: Microsoft Purview Unified Catalog API endpoint
  variables:
    accountName:
      description: The name of the Microsoft Purview account
      default: myaccount
security:
- oauth2: []
tags:
- name: Critical Data Elements
  description: Operations for managing critical data elements
paths:
  /criticaldataelements:
    get:
      operationId: listCriticalDataElements
      summary: Microsoft Purview List critical data elements
      description: List all critical data elements in the Purview unified catalog.
      tags:
      - Critical Data Elements
      parameters:
      - name: api-version
        in: query
        required: true
        schema:
          type: string
          default: 2024-03-01-preview
      - name: maxpagesize
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Critical data elements listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriticalDataElementList'
        '401':
          description: Unauthorized
    post:
      operationId: createCriticalDataElement
      summary: Microsoft Purview Create a critical data element
      description: Create a new critical data element definition.
      tags:
      - Critical Data Elements
      parameters:
      - name: api-version
        in: query
        required: true
        schema:
          type: string
          default: 2024-03-01-preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriticalDataElement'
      responses:
        '201':
          description: Critical data element created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriticalDataElement'
        '401':
          description: Unauthorized
components:
  schemas:
    CriticalDataElementList:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/CriticalDataElement'
        nextLink:
          type: string
    GovernanceContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        mail:
          type: string
          format: email
    CriticalDataElement:
      type: object
      description: A critical data element definition
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        businessDomainId:
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceContact'
        status:
          type: string
          enum:
          - Draft
          - Published
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    oauth2:
      type: oauth2
      description: Azure Active Directory OAuth2 authentication
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes:
            https://purview.azure.net/.default: Access Microsoft Purview
