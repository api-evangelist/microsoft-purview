      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/AtlasClassification'
        pageSize:
          type: integer
          format: int32
        sortBy:
          type: string
        sortType:
          type: string
        startIndex:
          type: integer
          format: int64
        totalCount:
          type: integer
          format: int64
    TimeBoundary:
      type: object
