components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Azure Active Directory OAuth2 authentication
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes:
            https://purview.azure.net/.default: Access Microsoft Purview
  schemas:
    AtlasEntity:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: true
        typeName:
          type: string
        lastModifiedTS:
          type: string
        businessAttributes:
          type: object
          additionalProperties: true
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/AtlasClassification'
        createTime:
          type: integer
          format: int64
        createdBy:
          type: string
        guid:
          type: string
          format: uuid
        labels:
          type: array
          items:
            type: string
        meanings:
          type: array
          items:
            $ref: '#/components/schemas/AtlasTermAssignmentHeader'
        status:
          type: string
          enum: [ACTIVE, DELETED]
        updateTime:
          type: integer
          format: int64
        updatedBy:
          type: string
        version:
          type: integer
          format: int64
    AtlasEntityWithExtInfo:
      type: object
      properties:
        entity:
          $ref: '#/components/schemas/AtlasEntity'
        referredEntities:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AtlasEntity'
    AtlasEntitiesWithExtInfo:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/AtlasEntity'
        referredEntities:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AtlasEntity'
    EntityMutationResponse:
      type: object
      properties:
        guidAssignments:
          type: object
          additionalProperties:
            type: string
        mutatedEntities:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AtlasEntityHeader'
    AtlasEntityHeader:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: true
        typeName:
          type: string
        classificationNames:
          type: array
          items:
            type: string
        displayText:
          type: string
        guid:
          type: string
          format: uuid
        labels:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, DELETED]
    AtlasClassification:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: true
        typeName:
          type: string
        entityGuid:
          type: string
          format: uuid
        propagate:
          type: boolean
    AtlasClassifications:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/AtlasClassification'
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int64
    AtlasTermAssignmentHeader:
      type: object
      properties:
        confidence:
          type: integer
          format: int32
        displayText:
          type: string
        relationGuid:
          type: string
          format: uuid
        status:
          type: string
        termGuid:
          type: string
          format: uuid
    AtlasGlossary:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        qualifiedName:
          type: string
        name:
          type: string
        shortDescription:
          type: string
        longDescription:
          type: string
        language:
          type: string
        usage:
          type: string
        terms:
          type: array
          items:
            $ref: '#/components/schemas/AtlasRelatedTermHeader'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AtlasRelatedCategoryHeader'
    AtlasGlossaryTerm:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        qualifiedName:
          type: string
        name:
          type: string
        shortDescription:
          type: string
        longDescription:
          type: string
        abbreviation:
          type: string
        status:
          type: string
          enum: [Draft, Approved, Alert, Expired]
        anchor:
          $ref: '#/components/schemas/AtlasGlossaryHeader'
    AtlasGlossaryHeader:
      type: object
      properties:
        displayText:
          type: string
        glossaryGuid:
          type: string
          format: uuid
        relationGuid:
          type: string
          format: uuid
    AtlasRelatedTermHeader:
      type: object
      properties:
        displayText:
          type: string
        relationGuid:
          type: string
          format: uuid
        termGuid:
          type: string
          format: uuid
    AtlasRelatedCategoryHeader:
      type: object
      properties:
        categoryGuid:
          type: string
          format: uuid
        displayText:
          type: string
        relationGuid:
          type: string
          format: uuid
    AtlasRelationship:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: true
        typeName:
          type: string
        end1:
          $ref: '#/components/schemas/AtlasObjectId'
        end2:
          $ref: '#/components/schemas/AtlasObjectId'
        guid:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, DELETED]
    AtlasRelationshipWithExtInfo:
      type: object
      properties:
        referredEntities:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AtlasEntity'
        relationship:
          $ref: '#/components/schemas/AtlasRelationship'
    AtlasObjectId:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        typeName:
          type: string
        uniqueAttributes:
          type: object
          additionalProperties: true
    AtlasLineageInfo:
      type: object
      properties:
        baseEntityGuid:
          type: string
          format: uuid
        guidEntityMap:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AtlasEntityHeader'
        lineageDepth:
          type: integer
          format: int32
        lineageDirection:
          type: string
          enum: [INPUT, OUTPUT, BOTH]
        relations:
          type: array
          items:
            $ref: '#/components/schemas/LineageRelation'
    LineageRelation:
      type: object
      properties:
        fromEntityId:
          type: string
          format: uuid
        relationshipId:
          type: string
          format: uuid
        toEntityId:
          type: string
          format: uuid
    SearchRequest:
      type: object
      properties:
        keywords:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        filter:
          type: object
        facets:
          type: array
          items:
            type: object
    SearchResult:
      type: object
      properties:
        searchCount:
          type: integer
          format: int32
        searchFacets:
          type: object
        value:
          type: array
          items:
            type: object
    SuggestRequest:
      type: object
      properties:
        keywords:
          type: string
        limit:
          type: integer
          format: int32
        filter:
          type: object
    SuggestResult:
      type: object
      properties:
        value:
          type: array
          items:
            type: object
    AutoCompleteRequest:
      type: object
      properties:
        keywords:
          type: string
        limit:
          type: integer
          format: int32
        filter:
          type: object
    AutoCompleteResult:
      type: object
      properties:
        value:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              queryPlusText:
                type: string
    AtlasTypesDef:
      type: object
      properties:
        classificationDefs:
          type: array
          items:
            $ref: '#/components/schemas/AtlasTypeDef'
        entityDefs:
          type: array
          items:
            $ref: '#/components/schemas/AtlasTypeDef'
        enumDefs:
          type: array
          items:
            $ref: '#/components/schemas/AtlasTypeDef'
        relationshipDefs:
          type: array
          items:
            $ref: '#/components/schemas/AtlasTypeDef'
        structDefs:
          type: array
          items:
            $ref: '#/components/schemas/AtlasTypeDef'
        termTemplateDefs:
          type: array
          items:
            $ref: '#/components/schemas/AtlasTypeDef'
    AtlasTypeDef:
      type: object
      properties:
        category:
          type: string
        description:
          type: string
        guid:
          type: string
          format: uuid
        name:
          type: string
        typeVersion:
          type: string
    AtlasTypeDefHeader:
      type: object
      properties:
        category:
          type: string
        guid:
          type: string
          format: uuid
        name:
          type: string
