generated: '2026-06-20'
method: searched
source: >-
  Registry lookups (PyPI, npm, NuGet, Maven Central) plus the Azure SDK for
  Purview landing page (https://azure.github.io/azure-sdk-for-python/purview.html,
  https://azure.github.io/azure-sdk-for-java/purview.html) and the Microsoft
  Graph SDKs used for the Purview eDiscovery / Information Protection / Records
  Management / Data Security & Governance Graph endpoints. All packages verified
  to return 200 from their registry JSON API.
notes: >-
  Microsoft ships per-service data-plane client libraries for the Purview
  account/catalog/scanning/data-map surface (Python azure-purview-*, JS
  @azure-rest/purview-*, .NET Azure.Analytics.Purview.*, Java
  com.azure:azure-analytics-purview-*). The management-plane account API is
  covered by azure-mgmt-purview. The Graph-based Purview APIs (eDiscovery,
  Information Protection, Records Management, DSPM) use the Microsoft Graph SDKs.
  The Catalog data-plane libraries are superseded by the Data Map libraries
  (Microsoft's guidance), which is recorded on those entries.
