specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Microsoft Purview
providerId: microsoft-purview
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Cost Management
  - Compliance
  - Microsoft
  - Data Governance
description: 'FOCUS-aligned FinOps for Microsoft Purview: dual model — user-based Microsoft 365 commerce
  for the Purview Suite ($12/user/month) and Azure-billed pay-as-you-go meters for data-plane features
  (Data Map, scanning, classification, Data Estate Insights, Data Security Investigations).'
sources:
  - https://www.microsoft.com/en-us/security/business/microsoft-purview
  - https://www.microsoft.com/en-us/security/business/purview-suite-pricing
  - https://azure.microsoft.com/en-us/pricing/details/purview/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Microsoft Corporation
serviceCategory: Compliance / Data Governance
billingModel:
  pricingCategory: Subscription + Pay-As-You-Go
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Credit
focusColumns:
  ServiceName: Microsoft Purview
  ServiceCategory: Security
  ServiceSubcategory: Data Governance
  ProviderName: Microsoft
  PublisherName: Microsoft Corporation
  InvoiceIssuerName: Microsoft Corporation
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: purview_suite_seats
    unit: seat-month
    aggregation: sum
    dimensions:
      - tenant
      - assigned_user
  - name: data_map_capacity_units
    unit: capacity-unit-hour
    aggregation: sum
    dimensions:
      - region
      - account
  - name: scan_vcore_hours
    unit: vCore-hour
    aggregation: sum
    dimensions:
      - region
      - source_type
  - name: classified_assets
    unit: asset
    aggregation: count
    dimensions:
      - region
      - source_type
  - name: data_estate_insights_assets
    unit: asset-month
    aggregation: max
    dimensions:
      - region
  - name: data_security_investigations
    unit: investigation
    aggregation: count
    dimensions:
      - region
      - investigator
principles:
  - name: Visibility
    description: Use Azure Cost Management exports plus the Purview governance portal to surface Data
      Map, scan, and classification consumption; cross-reference Microsoft 365 admin center seat usage
      for the Suite SKU.
  - name: Allocation
    description: Tag Purview accounts and scans with cost-center / data-domain tags; allocate Suite
      seats via Microsoft 365 license groups; map Data Estate Insights cost back to data-domain owners.
  - name: Optimization
    description: Tune scan frequency to actual data-change rates; deallocate idle Data Map capacity
      units between scans; consolidate Purview accounts within a tenant; combine M365 Suite + Azure
      pay-as-you-go to avoid double-charging users for governance modules already covered.
  - name: Accountability
    description: Assign a data-governance budget owner per Purview account; review Cost Management
      dashboards monthly; alert when scan-vCore-hours exceed forecast by 20%.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
